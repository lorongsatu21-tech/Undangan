function daysToEvent(d){if(!d)return 9999;let today=new Date();today.setHours(0,0,0,0);let e=new Date(d+'T00:00:00');return Math.ceil((e-today)/86400000)}
function deadlineText(d){let n=daysToEvent(d);if(n===9999)return 'Tanggal belum diisi';if(n<0)return `Lewat ${Math.abs(n)} hari`;if(n===0)return 'Hari ini';if(n===1)return 'Besok';return `${n} hari lagi`}

async function reportsPage(){setMenu('mReport');await loadAdminData();let valid=orders.filter(x=>x.status!=='dibatalkan'),rev=valid.reduce((a,x)=>a+Number(x.total||0),0),paid=payments.filter(x=>x.payment_status==='diterima').reduce((a,x)=>a+Number(x.amount||0),0),receivable=Math.max(0,rev-paid),avg=valid.length?rev/valid.length:0;let byStatus=Object.entries(statusLabel).map(([k,v])=>[v,orders.filter(x=>x.status===k).length]).filter(x=>x[1]);let productCount={};orders.forEach(o=>(o.order_items||[]).forEach(i=>productCount[i.product_name]=(productCount[i.product_name]||0)+Number(i.quantity||0)));let top=Object.entries(productCount).sort((a,b)=>b[1]-a[1]).slice(0,5);adminMain.innerHTML=`<div class="topline"><div><small class="muted">KINERJA USAHA</small><h1>Laporan</h1><p class="muted">Ringkasan omzet, pembayaran, piutang, pesanan, dan produk.</p></div><button class="btn ghost" onclick="exportReportCSV()">Export CSV</button></div><div class="stats"><div class="stat"><small>Omzet Pesanan</small><strong>${rup(rev)}</strong></div><div class="stat"><small>Pembayaran Masuk</small><strong>${rup(paid)}</strong></div><div class="stat"><small>Piutang</small><strong>${rup(receivable)}</strong></div><div class="stat"><small>Rata-rata Pesanan</small><strong>${rup(avg)}</strong></div></div><div class="settingGrid"><div class="panel"><h3 style="margin-top:0">Status Pesanan</h3>${byStatus.map(x=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')||'<p class="muted">Belum ada pesanan.</p>'}</div><div class="panel"><h3 style="margin-top:0">Produk Terlaris</h3>${top.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>${i+1}. ${x[0]}</span><b>${x[1]} pcs</b></div>`).join('')||'<p class="muted">Belum ada data.</p>'}</div></div><div class="panel" style="margin-top:14px"><h3 style="margin-top:0">Ringkasan</h3><div
