<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LORONGSATU21 — Undangan</title>
<style>
:root{--navy:#10283c;--blue:#0879ea;--bg:#f4f8fc;--line:#dbe6f1;--text:#12233b;--muted:#647995;--green:#13a94f;--red:#ef4040}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}
button{cursor:pointer}.hide{display:none!important}
.customer{max-width:430px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 30px #0001;padding-bottom:72px}.ctop{position:sticky;top:0;z-index:5;background:#fff;padding:15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.logo{font-size:20px;font-weight:800}.logo b{color:var(--blue)}.hero{margin:14px;border-radius:20px;padding:28px 20px;min-height:230px;background:linear-gradient(135deg,#12283c,#4b6b83);color:#fff;display:flex;flex-direction:column;justify-content:end}.hero h1{font:36px Georgia;margin:6px 0}.hero p{line-height:1.5}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700}.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.red{background:var(--red)}.search{width:calc(100% - 28px);margin:0 14px 14px;padding:13px;border:1px solid var(--line);border-radius:12px}.section{padding:0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.pic{aspect-ratio:4/5;background:linear-gradient(145deg,#efe7dc,#c8b08f);display:grid;place-items:center;text-align:center;padding:12px;font:18px Georgia}.card .info{padding:10px}.muted{color:var(--muted)}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:flex;justify-content:space-around;background:#fff;border-top:1px solid #ddd;padding:8px}nav button{border:0;background:none}
.admin{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:var(--navy);color:#fff;padding:28px 18px}.side .logo{font-size:30px;margin:0 12px 34px}.menu{display:grid;gap:8px}.menu button{border:0;background:transparent;color:#d9e7f3;text-align:left;padding:14px;border-radius:8px}.menu button.on,.menu button:hover{background:var(--blue);color:#fff}.main{padding:28px 32px;overflow:auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.topline h1{margin:0;font-size:30px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:24px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.stat strong{display:block;font-size:27px;margin-top:8px}.toolbar{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ccd9e6;border-radius:8px;background:#fff}.tablebox{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}.row{display:grid;grid-template-columns:48px 85px 125px minmax(190px,1fr) 120px 270px 95px 150px;min-width:1080px;border-bottom:1px solid var(--line);align-items:center}.row>*{padding:12px;font-size:13px}.row.head{font-weight:700;background:#f7fbff}.thumb{width:54px;height:54px;border-radius:7px;background:#e8edf3;object-fit:cover}.pill{padding:6px 9px;border-radius:8px;background:#e9f4ff;color:#0870d4;display:inline-block}.status{display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}.dot.off{background:var(--red)}.actions{display:flex;gap:6px}.actions button{border:0;border-radius:7px;padding:8px 10px;background:var(--blue);color:#fff}.actions .del{background:var(--red)}
.formwrap{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:24px;margin-top:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field.full{grid-column:1/-1}.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.previewPic{aspect-ratio:4/3;border-radius:10px;background:linear-gradient(145deg,#eadfce,#bba17e);display:grid;place-items:center;text-align:center;padding:20px;font:25px Georgia;overflow:hidden}.previewPic img{width:100%;height:100%;object-fit:cover}.footerBtns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.orderrow{display:grid;grid-template-columns:140px 1fr 100px 170px 140px;min-width:760px;border-bottom:1px solid var(--line)}.orderrow>*{padding:12px}.notice{padding:12px;border-radius:10px;background:#fff6dc;border:1px solid #efd999;margin:12px 0}
@media(max-width:850px){.admin{grid-template-columns:1fr}.side{padding:12px}.side .logo{margin:4px 8px 12px}.menu{display:flex;overflow:auto}.menu button{white-space:nowrap}.main{padding:16px}.stats{grid-template-columns:1fr 1fr}.formwrap{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.prices{grid-template-columns:1fr 1fr}}

.detail{padding:14px}.detail .big{aspect-ratio:4/3;border-radius:16px;background:#eee;overflow:hidden;display:grid;place-items:center}.detail .big img{width:100%;height:100%;object-fit:cover}.qtys{display:flex;gap:7px;flex-wrap:wrap}.qtys button{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px}.qtys button.on{background:var(--navy);color:#fff}.checkout{display:grid;gap:10px}.checkout input,.checkout textarea,.checkout select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px}.timeline{display:grid;gap:8px;margin:15px 0}.step{padding:10px;border-left:4px solid #ccd9e6;background:#f7f9fb}.step.done{border-color:var(--green)}.catlist{display:flex;gap:8px;flex-wrap:wrap}.catitem{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}.reportgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.settingGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.reportgrid,.settingGrid{grid-template-columns:1fr}}
</style>
<style>.loginbox{max-width:420px;margin:70px auto;background:#fff;padding:24px;border:1px solid var(--line);border-radius:14px}.loginbox input{width:100%;padding:12px;margin:7px 0;border:1px solid var(--line);border-radius:9px}.loading{padding:40px;text-align:center;color:var(--muted)}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script></head><body>
<div id="customer" class="customer"><header class="ctop"><div class="logo">LORONGSATU<b>21</b></div><button class="btn" onclick="openAdmin()">ADMIN</button></header><div id="catalogView"></div><nav><button onclick="renderCatalog()">⌂<small> Beranda</small></button><button onclick="renderCatalog()">▦<small> Katalog</small></button><button onclick="myOrders()">▤<small> Pesanan</small></button><button onclick="openAdmin()">⚙<small> Admin</small></button></nav></div>
<div id="admin" class="admin hide"><aside class="side"><div class="logo">LS<b>21</b><div style="font-size:11px;letter-spacing:2px;font-weight:400">UNDANGAN</div></div><div class="menu"><button id="mDash" onclick="dashboard()">⌂ Dashboard</button><button id="mProd" onclick="productsPage()">▣ Produk</button><button id="mCat" onclick="categoriesPage()">▦ Kategori</button><button id="mOrder" onclick="ordersPage()">▤ Pesanan</button><button id="mCust" onclick="customersPage()">♙ Pelanggan</button><button id="mReport" onclick="reportsPage()">▥ Laporan</button><button onclick="logoutAdmin()">⇥ Keluar</button></div></aside><main id="adminMain" class="main"></main></div>
<script>
const $=s=>document.querySelector(s), rup=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const sb=supabase.createClient(LS21_CONFIG.SUPABASE_URL,LS21_CONFIG.SUPABASE_PUBLISHABLE_KEY);
let products=[],categories=[],orders=[],customers=[],selectedQty=100,selectedCode='',pendingFile=null;
const statusLabel={baru:'Pesanan Baru',menunggu_pembayaran:'Menunggu Pembayaran',desain:'Desain',menunggu_acc:'Menunggu ACC',cetak:'Cetak',finishing:'Finishing',siap:'Siap Diambil',selesai:'Selesai',dibatalkan:'Dibatalkan'};
function slugify(x){return x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('item-'+Date.now())}
function setMenu(id){document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('on'));if(id)$('#'+id)?.classList.add('on')}
async function loadCatalogData(){catalogView.innerHTML='<div class="loading">Memuat katalog…</div>';let {data:c,error:ce}=await sb.from('categories').select('*').eq('is_active',true).order('sort_order');let {data:p,error:pe}=await sb.from('products').select('*,categories(name),product_prices(quantity,unit_price),product_images(image_url,is_primary,sort_order)').eq('is_active',true).order('created_at',{ascending:false});if(ce||pe){catalogView.innerHTML='<div class="notice">Gagal mengambil data. '+(ce||pe).message+'</div>';return}categories=c||[];products=(p||[]).map(mapProduct);renderCatalogNow()}
function mapProduct(x){let prices={};(x.product_prices||[]).forEach(v=>prices[v.quantity]=Number(v.unit_price));let imgs=(x.product_images||[]).sort((a,b)=>(b.is_primary-a.is_primary)||(a.sort_order-b.sort_order));return {...x,code:x.product_code,cat:x.categories?.name||'',sub:x.motif||'',desc:x.description||'',active:x.is_active,image:imgs[0]?.image_url||'',p100:prices[100]||0,p300:prices[300]||0,p500:prices[500]||0,p1000:prices[1000]||0}}
function renderCatalog(){loadCatalogData()}
function renderCatalogNow(){catalogView.innerHTML=`<section class="hero"><small>KOLEKSI UNDANGAN LORONGSATU21</small><h1>Temukan desain pilihan Anda.</h1><p>Katalog online terhubung langsung ke database LORONGSATU21.</p></section><input class="search" placeholder="Cari model undangan..." oninput="filterCatalog(this.value)"><section class="section"><h2>Model Undangan</h2><div id="catalogGrid" class="grid">${products.map(card).join('')}</div></section>`}
function card(p){return `<article class="card" onclick="productDetail('${p.code}')"><div class="pic">${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover">`:p.name}</div><div class="info"><small class="muted">${p.code} · ${p.cat}</small><b style="display:block;margin:5px 0">${p.name}</b><span>Mulai ${rup(Math.min(...[p.p100,p.p300,p.p500,p.p1000].filter(Boolean)))}</span></div></article>`}
function filterCatalog(q){let z=q.toLowerCase();catalogGrid.innerHTML=products.filter(x=>(x.name+x.code+x.cat+x.sub).toLowerCase().includes(z)).map(card).join('')}
function unitPrice(p,q){return q>=1000?p.p1000:q>=500?p.p500:q>=300?p.p300:p.p100}
function productDetail(code){let p=products.find(x=>x.code==code);selectedCode=code;selectedQty=100;catalogView.innerHTML=`<div class="detail"><button class="btn ghost" onclick="renderCatalogNow()">← Katalog</button><div class="big" style="margin-top:12px">${p.image?`<img src="${p.image}">`:p.name}</div><small class="muted">${p.code} · ${p.cat} · ${p.sub}</small><h1>${p.name}</h1><p>${p.desc}</p><div class="notice">${p.material||'-'} · ${p.size||'-'} · ${p.model||'-'} · ${p.color||'-'}</div><h3>Pilih jumlah</h3><div class="qtys">${[100,300,500,1000].filter(q=>unitPrice(p,q)>0).map(q=>`<button id="q${q}" class="${q==100?'on':''}" onclick="chooseQty(${q})">${q.toLocaleString('id-ID')}</button>`).join('')}</div><h2 id="priceBox">${rup(unitPrice(p,100))}/pcs · Total ${rup(unitPrice(p,100)*100)}</h2><button class="btn" style="width:100%" onclick="checkoutPage()">Pilih & Lanjutkan</button></div>`}
function chooseQty(q){selectedQty=q;document.querySelectorAll('.qtys button').forEach(x=>x.classList.remove('on'));$('#q'+q).classList.add('on');let p=products.find(x=>x.code==selectedCode),u=unitPrice(p,q);priceBox.textContent=`${rup(u)}/pcs · Total ${rup(u*q)}`}
function checkoutPage(){let p=products.find(x=>x.code==selectedCode),u=unitPrice(p,selectedQty);catalogView.innerHTML=`<div class="detail"><button class="btn ghost" onclick="productDetail('${p.code}')">← Kembali</button><h1>Checkout</h1><div class="notice"><b>${p.name}</b><br>${selectedQty} pcs × ${rup(u)} = <b>${rup(u*selectedQty)}</b></div><div class="checkout"><input id="coName" placeholder="Nama pelanggan *"><input id="coWa" placeholder="Nomor WhatsApp *"><input id="coBride" placeholder="Nama mempelai wanita"><input id="coGroom" placeholder="Nama mempelai pria"><input id="coDate" type="date"><input id="coVenue" placeholder="Lokasi acara"><textarea id="coNote" placeholder="Catatan pesanan"></textarea><button class="btn" onclick="submitOrder()">BUAT PESANAN</button></div></div>`}
async function submitOrder(){if(!coName.value.trim()||!coWa.value.trim())return alert('Nama dan WhatsApp wajib diisi.');let p=products.find(x=>x.code==selectedCode),u=unitPrice(p,selectedQty);let {data,error}=await sb.rpc('create_public_order',{p_name:coName.value.trim(),p_phone:coWa.value.trim(),p_event_date:coDate.value||null,p_event_location:coVenue.value||null,p_notes:[coBride.value&&('Mempelai wanita: '+coBride.value),coGroom.value&&('Mempelai pria: '+coGroom.value),coNote.value].filter(Boolean).join(' | '),p_product_id:p.id,p_quantity:selectedQty,p_unit_price:u});if(error)return alert('Pesanan gagal: '+error.message);localStorage.setItem('ls21_last_order',data);orderSuccess(data)}
function orderSuccess(id){catalogView.innerHTML=`<div class="detail" style="padding-top:60px;text-align:center"><h1>Pesanan berhasil dibuat</h1><p>Kode pesanan Anda:</p><h2>${id}</h2><p class="muted">Simpan kode ini.</p><button class="btn" onclick="myOrders()">Lihat Pesanan</button></div>`}
async function myOrders(){let id=localStorage.getItem('ls21_last_order');if(!id){catalogView.innerHTML='<div class="detail"><h1>Pesanan Saya</h1><p>Belum ada kode pesanan tersimpan di perangkat ini.</p></div>';return}let {data,error}=await sb.rpc('get_public_order_status',{p_order_number:id});if(error||!data?.length){catalogView.innerHTML='<div class="detail"><h1>Pesanan Saya</h1><p>Pesanan tidak ditemukan.</p></div>';return}let x=data[0],sts=['baru','menunggu_pembayaran','desain','menunggu_acc','cetak','finishing','siap','selesai'],cur=sts.indexOf(x.status);catalogView.innerHTML=`<div class="detail"><h1>Pesanan Saya</h1><div class="notice"><b>${x.order_number}</b><br>Total ${rup(x.total)}</div><h3>Status: ${statusLabel[x.status]||x.status}</h3><div class="timeline">${sts.map((s,i)=>`<div class="step ${i<=cur?'done':''}">${i+1}. ${statusLabel[s]}</div>`).join('')}</div></div>`}
async function openAdmin(){let {data:{session}}=await sb.auth.getSession();customer.classList.add('hide');admin.classList.remove('hide');if(!session)return loginPage();dashboard()}
function closeAdmin(){admin.classList.add('hide');customer.classList.remove('hide');renderCatalog()}
function loginPage(){adminMain.innerHTML=`<div class="loginbox"><h1>Admin LORONGSATU21</h1><p class="muted">Masuk dengan akun Admin Supabase.</p><input id="loginEmail" type="email" placeholder="Email"><input id="loginPass" type="password" placeholder="Password"><button class="btn" style="width:100%" onclick="loginAdmin()">Masuk</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeAdmin()">Kembali</button></div>`}
async function loginAdmin(){let {error}=await sb.auth.signInWithPassword({email:loginEmail.value,password:loginPass.value});if(error)return alert('Login gagal: '+error.message);let {data,isErr}=await sb.rpc('is_admin');if(isErr||!data){await sb.auth.signOut();return alert('Akun ini bukan Admin.')}dashboard()}
async function logoutAdmin(){await sb.auth.signOut();loginPage()}
async function loadAdminData(){let [p,c,o,u]=await Promise.all([sb.from('products').select('*,categories(name),product_prices(quantity,unit_price),product_images(image_url,is_primary,sort_order)').order('created_at',{ascending:false}),sb.from('categories').select('*').order('sort_order'),sb.from('orders').select('*,customers(name,phone),order_items(quantity,product_name)').order('created_at',{ascending:false}),sb.from('customers').select('*').order('created_at',{ascending:false})]);if(p.error)throw p.error;products=(p.data||[]).map(mapProduct);categories=c.data||[];orders=o.data||[];customers=u.data||[]}
async function dashboard(){setMenu('mDash');adminMain.innerHTML='<div class="loading">Memuat dashboard…</div>';try{await loadAdminData()}catch(e){return adminMain.innerHTML='<div class="notice">'+e.message+'</div>'}adminMain.innerHTML=`<div class="topline"><div><small class="muted">ADMIN PANEL</small><h1>Dashboard</h1></div><button class="btn ghost" onclick="closeAdmin()">Lihat Katalog</button></div><div class="stats"><div class="stat"><small>Total Produk</small><strong>${products.length}</strong></div><div class="stat"><small>Produk Aktif</small><strong>${products.filter(x=>x.active).length}</strong></div><div class="stat"><small>Pesanan</small><strong>${orders.length}</strong></div><div class="stat"><small>Menunggu ACC</small><strong>${orders.filter(x=>x.status=='menunggu_acc').length}</strong></div></div>${orderTable(orders.slice(0,10))}`}
async function productsPage(){setMenu('mProd');await loadAdminData();adminMain.innerHTML=`<div class="topline"><div><h1>Manajemen Produk</h1><p class="muted">Produk tersimpan di Supabase.</p></div><button class="btn" onclick="productForm()">＋ Tambah Produk</button></div><div id="productTable"></div>`;drawProductTable()}
function drawProductTable(){productTable.innerHTML=`<div class="tablebox"><div class="row head"><span>No</span><span>Foto</span><span>Kode</span><span>Nama Produk</span><span>Kategori</span><span>Harga</span><span>Status</span><span>Aksi</span></div>${products.map((x,i)=>`<div class="row"><span>${i+1}</span><span>${x.image?`<img class="thumb" src="${x.image}">`:'-'}</span><b>${x.code}</b><span>${x.name}</span><span>${x.cat}</span><span>${rup(x.p100)} · ${rup(x.p300)} · ${rup(x.p500)} · ${rup(x.p1000)}</span><span>${x.active?'Aktif':'Nonaktif'}</span><span class="actions"><button onclick="productForm('${x.code}')">✎</button><button onclick="toggleProduct('${x.code}')">◉</button><button class="del" onclick="deleteProduct('${x.code}')">⌫</button></span></div>`).join('')}</div>`}
function productForm(code=''){let x=products.find(v=>v.code==code)||{code:'LS-U-'+String(products.length+1).padStart(4,'0'),name:'',cat:categories[0]?.name||'',sub:'Floral',material:'',size:'10 × 21 cm',model:'Lipat 2',color:'',desc:'',p100:0,p300:0,p500:0,p1000:0,active:true,image:''};pendingFile=null;adminMain.innerHTML=`<div class="topline"><h1>${code?'Edit':'Tambah'} Produk</h1></div><div class="formwrap"><div class="panel"><div class="formgrid"><div class="field full"><label>Nama Produk *</label><input id="fName" value="${x.name}"></div><div class="field"><label>Kode *</label><input id="fCode" value="${x.code}"></div><div class="field"><label>Kategori</label><select id="fCat">${categories.map(v=>`<option value="${v.id}" ${v.name==x.cat?'selected':''}>${v.name}</option>`).join('')}</select></div><div class="field"><label>Motif</label><input id="fSub" value="${x.sub||''}"></div><div class="field"><label>Bahan</label><input id="fMat" value="${x.material||''}"></div><div class="field"><label>Ukuran</label><input id="fSize" value="${x.size||''}"></div><div class="field"><label>Model</label><input id="fModel" value="${x.model||''}"></div><div class="field"><label>Warna</label><input id="fColor" value="${x.color||''}"></div><div class="field full"><label>Deskripsi</label><textarea id="fDesc">${x.desc||''}</textarea></div><div class="field full"><label>Harga per pcs</label><div class="prices"><input type="number" id="f100" value="${x.p100}"><input type="number" id="f300" value="${x.p300}"><input type="number" id="f500" value="${x.p500}"><input type="number" id="f1000" value="${x.p1000}"></div></div><div class="field full"><label>Foto Produk</label><input type="file" accept="image/jpeg,image/png,image/webp" onchange="pendingFile=this.files[0]"></div><div class="field full"><label><input type="checkbox" id="fActive" ${x.active?'checked':''}> Aktif</label></div></div></div><div class="panel"><h3>Foto saat ini</h3><div class="previewPic">${x.image?`<img src="${x.image}">`:'Belum ada foto'}</div></div></div><div class="footerBtns"><button class="btn ghost" onclick="productsPage()">Batal</button><button class="btn" onclick="saveProduct('${code}')">Simpan Produk</button></div>`}
async function saveProduct(oldCode){if(!fCode.value.trim()||!fName.value.trim())return alert('Kode dan nama wajib diisi.');let old=products.find(x=>x.code==oldCode);let row={product_code:fCode.value.trim(),category_id:fCat.value||null,name:fName.value.trim(),slug:slugify(fName.value)+'-'+fCode.value.toLowerCase(),description:fDesc.value,motif:fSub.value,material:fMat.value,size:fSize.value,model:fModel.value,color:fColor.value,is_active:fActive.checked};let res=old?await sb.from('products').update(row).eq('id',old.id).select().single():await sb.from('products').insert(row).select().single();if(res.error)return alert(res.error.message);let pid=res.data.id;await sb.from('product_prices').delete().eq('product_id',pid);let prs=[[100,f100.value],[300,f300.value],[500,f500.value],[1000,f1000.value]].filter(x=>Number(x[1])>0).map(x=>({product_id:pid,quantity:x[0],unit_price:Number(x[1])}));if(prs.length){let r=await sb.from('product_prices').insert(prs);if(r.error)return alert(r.error.message)}if(pendingFile){let ext=pendingFile.name.split('.').pop().toLowerCase(),path=`${pid}/${Date.now()}.${ext}`;let up=await sb.storage.from('product-images').upload(path,pendingFile,{upsert:false});if(up.error)return alert('Produk tersimpan, foto gagal: '+up.error.message);let url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;await sb.from('product_images').update({is_primary:false}).eq('product_id',pid);await sb.from('product_images').insert({product_id:pid,image_url:url,is_primary:true,sort_order:0})}alert('Produk tersimpan.');productsPage()}
async function toggleProduct(code){let x=products.find(v=>v.code==code);let {error}=await sb.from('products').update({is_active:!x.active}).eq('id',x.id);if(error)return alert(error.message);productsPage()}
async function deleteProduct(code){if(!confirm('Hapus produk ini?'))return;let x=products.find(v=>v.code==code);let {error}=await sb.from('products').delete().eq('id',x.id);if(error)return alert(error.message);productsPage()}
async function categoriesPage(){setMenu('mCat');await loadAdminData();adminMain.innerHTML=`<h1>Kategori</h1><div class="panel"><div class="toolbar"><input id="newCat" placeholder="Nama kategori baru"><button class="btn" onclick="addCat()">Tambah</button></div><div class="catlist">${categories.map(x=>`<span class="catitem">${x.name} <button onclick="delCat('${x.id}')">×</button></span>`).join('')}</div></div>`}
async function addCat(){let name=newCat.value.trim();if(!name)return;let {error}=await sb.from('categories').insert({name,slug:slugify(name)});if(error)return alert(error.message);categoriesPage()}
async function delCat(id){if(!confirm('Hapus kategori?'))return;let {error}=await sb.from('categories').delete().eq('id',id);if(error)return alert(error.message);categoriesPage()}
function orderTable(o){return `<div class="tablebox"><div class="orderrow" style="font-weight:bold;background:#f7fbff"><span>Kode</span><span>Pelanggan</span><span>Jumlah</span><span>Status</span><span>Aksi</span></div>${o.map(x=>`<div class="orderrow"><b>${x.order_number}</b><span>${x.customers?.name||'-'}</span><span>${x.order_items?.[0]?.quantity||0} pcs</span><span>${statusLabel[x.status]||x.status}</span><span><button class="btn" onclick="orderDetail('${x.id}')">Buka</button></span></div>`).join('')}</div>`}
async function ordersPage(){setMenu('mOrder');await loadAdminData();adminMain.innerHTML='<h1>Pesanan</h1>'+orderTable(orders)}
function orderDetail(id){let x=orders.find(v=>v.id==id);adminMain.innerHTML=`<button class="btn ghost" onclick="ordersPage()">← Kembali</button><h1>${x.customers?.name||'-'}</h1><div class="notice"><b>${x.order_number}</b><br>Total ${rup(x.total)}</div><div class="panel"><label>Status Produksi</label><select id="orderStatus" style="width:100%;padding:12px;margin:10px 0">${Object.entries(statusLabel).map(([k,v])=>`<option value="${k}" ${k==x.status?'selected':''}>${v}</option>`).join('')}</select><button class="btn" onclick="saveOrderStatus('${id}')">Simpan Status</button></div>`}
async function saveOrderStatus(id){let {error}=await sb.from('orders').update({status:orderStatus.value}).eq('id',id);if(error)return alert(error.message);ordersPage()}
async function customersPage(){setMenu('mCust');await loadAdminData();adminMain.innerHTML=`<h1>Pelanggan</h1><div class="tablebox">${customers.map(x=>`<div class="orderrow"><span>${x.phone}</span><b>${x.name}</b><span></span><span>${x.email||''}</span><span></span></div>`).join('')}</div>`}
async function reportsPage(){setMenu('mReport');await loadAdminData();let rev=orders.reduce((a,x)=>a+Number(x.total||0),0);adminMain.innerHTML=`<h1>Laporan</h1><div class="reportgrid"><div class="stat"><small>Omzet Pesanan</small><strong>${rup(rev)}</strong></div><div class="stat"><small>Jumlah Pesanan</small><strong>${orders.length}</strong></div><div class="stat"><small>Rata-rata</small><strong>${rup(orders.length?rev/orders.length:0)}</strong></div></div>`}
loadCatalogData();
</script></body></html>
