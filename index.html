<script>
const $=s=>document.querySelector(s), rup=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const sb=supabase.createClient(LS21_CONFIG.SUPABASE_URL,LS21_CONFIG.SUPABASE_PUBLISHABLE_KEY);
let products=[],categories=[],orders=[],customers=[],designs=[],payments=[],selectedQty=100,selectedCode='',pendingFile=null,pendingDesignFile=null;
const statusLabel={baru:'Pesanan Baru',menunggu_pembayaran:'Menunggu Pembayaran',desain:'Desain',menunggu_acc:'Menunggu ACC',cetak:'Cetak',finishing:'Finishing',siap:'Siap Diambil',selesai:'Selesai',dibatalkan:'Dibatalkan'};
function slugify(x){return x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('item-'+Date.now())}
function setMenu(id){document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('on'));if(id)$('#'+id)?.classList.add('on')}
async function loadCatalogData(){catalogView.innerHTML='<div class="loading">Memuat katalog…</div>';let {data:c,error:ce}=await sb.from('categories').select('*').eq('is_active',true).order('sort_order');let {data:p,error:pe}=await sb.from('products').select('*,categories(name),product_prices(quantity,unit_price),product_images(image_url,is_primary,sort_order)').eq('is_active',true).order('created_at',{ascending:false});if(ce||pe){catalogView.innerHTML='<div class="notice">Gagal mengambil data. '+(ce||pe).message+'</div>';return}categories=c||[];products=(p||[]).map(mapProduct);renderCatalogNow()}
function mapProduct(x){let prices={};(x.product_prices||[]).forEach(v=>prices[v.quantity]=Number(v.unit_price));let imgs=(x.product_images||[]).sort((a,b)=>(b.is_primary-a.is_primary)||(a.sort_order-b.sort_order));return {...x,code:x.product_code,cat:x.categories?.name||'',sub:x.motif||'',desc:x.description||'',active:x.is_active,image:imgs[0]?.image_url||'',p100:prices[100]||0,p300:prices[300]||0,p500:prices[500]||0,p1000:prices[1000]||0}}
async function renderHome(){catalogView.innerHTML='<div class="loading">Memuat beranda…</div>';if(!products.length){let {data:c,error:ce}=await sb.from('categories').select('*').eq('is_active',true).order('sort_order');let {data:p,error:pe}=await sb.from('products').select('*,categories(name),product_prices(quantity,unit_price),product_images(image_url,is_primary,sort_order)').eq('is_active',true).order('created_at',{ascending:false});if(ce||pe){catalogView.innerHTML='<div class="notice">Gagal mengambil data. '+(ce||pe).message+'</div>';return}categories=c||[];products=(p||[]).map(mapProduct)}renderHomeNow()}
function renderHomeNow(){let latest=products.slice(0,4);catalogView.innerHTML=`<section class="homeHero"><div class="eyebrow">LORONGSATU21 · WEDDING & INVITATION</div><h1>Satu tempat untuk kebutuhan undangan Anda.</h1><p>Pilih undangan cetak, digital, link, serta layanan pendukung dengan proses yang mudah dan terarah.</p><div class="heroActions"><button class="btn" onclick="renderCatalog()">Lihat Katalog Cetak</button><button class="btn ghost" onclick="myOrders()">Cek Pesanan</button></div></section><section class="section"><div class="sectionHead"><h2>Layanan Undangan</h2></div><div class="serviceGrid"><div class="serviceCard" onclick="renderCatalog()"><span class="ico">▤</span><b>Undangan Cetak</b><small>Katalog desain, pilihan bahan, ukuran dan harga bertingkat.</small></div><div class="serviceCard" onclick="comingSoon('Undangan Digital')"><span class="ico">◫</span><b>Undangan Digital</b><small>Undangan modern untuk dibagikan secara online.</small></div><div class="serviceCard" onclick="comingSoon('Undangan Link')"><span class="ico">↗</span><b>Undangan Link</b><small>Halaman undangan personal dengan link khusus.</small></div><div class="serviceCard" onclick="comingSoon('Foto & Video')"><span class="ico">◉</span><b>Foto & Video</b><small>Layanan visual pendukung acara dan undangan.</small></div></div><div class="sectionHead"><h2>Produk Terbaru</h2><button class="linkBtn" onclick="renderCatalog()">Lihat semua →</button></div>${latest.length?`<div class="featuredGrid">${latest.map(card).join('')}</div>`:'<div class="emptySoon">Produk terbaru akan tampil di sini setelah ditambahkan dari Admin.</div>'}</section><div class="trust"><div><b>Online</b><small>Data tersimpan aman</small></div><div><b>Terpusat</b><small>Supabase master data</small></div><div><b>Mudah</b><small>Pesan & pantau status</small></div></div>`}
function comingSoon(name){alert(name+' sedang disiapkan. Saat ini Anda dapat menggunakan Undangan Cetak.')}
function renderCatalog(){loadCatalogData()}
function uniq(arr){return [...new Set(arr.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'id'))}
let catalogFilters={cat:'',motif:'',color:'',size:'',model:'',q:'',sort:'new'};
function renderCatalogNow(){catalogFilters={cat:'',motif:'',color:'',size:'',model:'',q:'',sort:'new'};catalogView.innerHTML=`<div class="catalogTitle"><small class="muted">UNDANGAN CETAK</small><h1>Temukan desain pilihan Anda.</h1><p class="muted" style="line-height:1.5">Pilih desain, bahan dan jumlah sesuai kebutuhan acara.</p></div><div class="catalogTools"><input class="search" style="width:100%;margin:0" placeholder="Cari nama, kode, motif..." oninput="setFilter('q',this.value)"><select onchange="setFilter('sort',this.value)"><option value="new">Terbaru</option><option value="low">Harga terendah</option><option value="high">Harga tertinggi</option><option value="name">Nama A–Z</option></select></div><div class="chips"><button class="chip on" data-cat="" onclick="setCat('',this)">Semua</button>${categories.map(c=>`<button class="chip" data-cat="${c.name}" onclick="setCat('${c.name.replace(/'/g,"\\'")}',this)">${c.name}</button>`).join('')}</div><div class="filterRow"><select onchange="setFilter('motif',this.value)"><option value="">Semua motif</option>${uniq(products.map(p=>p.sub)).map(v=>`<option>${v}</option>`).join('')}</select><select onchange="setFilter('color',this.value)"><option value="">Semua warna</option>${uniq(products.map(p=>p.color)).map(v=>`<option>${v}</option>`).join('')}</select><select onchange="setFilter('size',this.value)"><option value="">Semua ukuran</option>${uniq(products.map(p=>p.size)).map(v=>`<option>${v}</option>`).join('')}</select><select onchange="setFilter('model',this.value)"><option value="">Semua model</option>${uniq(products.map(p=>p.model)).map(v=>`<option>${v}</option>`).join('')}</select></div><div id="resultBar" class="resultBar"></div><section class="section"><div id="catalogGrid" class="grid"></div></section>`;applyCatalogFilters()}
function setCat(cat,el){catalogFilters.cat=cat;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));el.classList.add('on');applyCatalogFilters()}
function setFilter(k,v){catalogFilters[k]=v;applyCatalogFilters()}
function minPrice(p){let a=[p.p100,p.p300,p.p500,p.p1000].filter(Number);return a.length?Math.min(...a):0}
function applyCatalogFilters(){let f=catalogFilters,z=(f.q||'').toLowerCase().trim();let arr=products.filter(p=>(!f.cat||p.cat==f.cat)&&(!f.motif||p.sub==f.motif)&&(!f.color||p.color==f.color)&&(!f.size||p.size==f.size)&&(!f.model||p.model==f.model)&&(!z||(p.name+' '+p.code+' '+p.cat+' '+p.sub+' '+p.color+' '+p.material).toLowerCase().includes(z)));if(f.sort=='low')arr.sort((a,b)=>minPrice(a)-minPrice(b));if(f.sort=='high')arr.sort((a,b)=>minPrice(b)-minPrice(a));if(f.sort=='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'id'));resultBar.innerHTML=`<span>${arr.length} produk ditemukan</span><span>${[f.cat,f.motif,f.color,f.size,f.model].filter(Boolean).length?'Filter aktif':'Semua koleksi'}</span>`;catalogGrid.innerHTML=arr.length?arr.map(card).join(''):'<div class="catalogEmpty">Belum ada produk yang sesuai dengan filter ini.</div>'}
function filterCategory(cat,el){setCat(cat,el)}
function card(p){let mp=minPrice(p);return `<article class="card" onclick="productDetail('${p.code}')"><div class="pic">${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover">`:p.name}<span class="cardBadge">${p.sub||p.cat||'Undangan'}</span></div><div class="info"><small class="muted">${p.code}${p.cat?' · '+p.cat:''}</small><b style="display:block;margin:5px 0">${p.name}</b><span>${mp?'Mulai '+rup(mp)+'/pcs':'Hubungi kami'}</span></div></article>`}
function filterCatalog(q){catalogFilters.q=q;applyCatalogFilters()}
function unitPrice(p,q){return q>=1000?p.p1000:q>=500?p.p500:q>=300?p.p300:p.p100}
function getFavs(){try{return JSON.parse(localStorage.getItem('ls21_favs')||'[]')}catch{return []}}
function toggleFav(code){let a=getFavs(),i=a.indexOf(code);i>=0?a.splice(i,1):a.push(code);localStorage.setItem('ls21_favs',JSON.stringify(a));productDetail(code)}
function productDetail(code){let p=products.find(x=>x.code==code);if(!p)return;selectedCode=code;let tiers=[100,300,500,1000].filter(q=>unitPrice(p,q)>0);selectedQty=tiers[0]||100;let fav=getFavs().includes(code);catalogView.innerHTML=`<div class="detailHero"><button class="btn ghost" onclick="renderCatalogNow()">← Katalog</button><div class="detailPhoto" style="margin-top:12px">${p.image?`<img src="${p.image}">`:`<span>${p.name}</span>`}</div><div class="detailMeta"><span class="detailCode">${p.code} · ${p.cat||'UNDANGAN'}</span><button class="favBtn" onclick="toggleFav('${p.code}')">${fav?'♥ Tersimpan':'♡ Simpan'}</button></div><h1 class="detailTitle">${p.name}</h1><p class="detailDesc">${p.desc||'Desain undangan yang dapat disesuaikan dengan data acara dan kebutuhan Anda.'}</p><div class="specGrid"><div class="specItem"><small>Bahan</small><b>${p.material||'-'}</b></div><div class="specItem"><small>Ukuran</small><b>${p.size||'-'}</b></div><div class="specItem"><small>Model</small><b>${p.model||'-'}</b></div><div class="specItem"><small>Warna</small><b>${p.color||'-'}</b></div><div class="specItem"><small>Motif</small><b>${p.sub||'-'}</b></div><div class="specItem"><small>Min. Pesanan</small><b>${p.min_order||100} pcs</b></div></div><div class="pricePanel"><h3>Pilih jumlah</h3><div class="priceTiers">${tiers.map((q,i)=>`<button id="q${q}" class="tier ${i==0?'on':''}" onclick="chooseQty(${q})"><b>${q.toLocaleString('id-ID')} pcs</b><small>${rup(unitPrice(p,q))}/pcs</small></button>`).join('')}</div><div class="totalBox"><span><small class="muted">Estimasi total</small><br><span id="unitBox">${rup(unitPrice(p,selectedQty))}/pcs</span></span><strong id="totalPrice">${rup(unitPrice(p,selectedQty)*selectedQty)}</strong></div></div><div class="detailActions"><button class="btn primary" onclick="checkoutPage()">Pesan Produk Ini</button><button class="btn ghost" onclick="renderCatalogNow()">Lihat Produk Lain</button><button class="btn ghost" onclick="toggleFav('${p.code}')">${fav?'♥ Favorit':'♡ Favorit'}</button></div></div>`}
function chooseQty(q){selectedQty=q;document.querySelectorAll('.tier').forEach(x=>x.classList.remove('on'));$('#q'+q)?.classList.add('on');let p=products.find(x=>x.code==selectedCode),u=unitPrice(p,q);if($('#unitBox'))unitBox.textContent=rup(u)+'/pcs';if($('#totalPrice'))totalPrice.textContent=rup(u*q)}
function checkoutPage(){let p=products.find(x=>x.code==selectedCode),u=unitPrice(p,selectedQty);catalogView.innerHTML=`<div class="detail"><button class="btn ghost" onclick="productDetail('${p.code}')">← Kembali</button><h1>Checkout</h1><div class="notice"><b>${p.name}</b><br>${selectedQty} pcs × ${rup(u)} = <b>${rup(u*selectedQty)}</b></div><div class="checkout"><input id="coName" placeholder="Nama pelanggan *"><input id="coWa" placeholder="Nomor WhatsApp *"><input id="coBride" placeholder="Nama mempelai wanita"><input id="coGroom" placeholder="Nama mempelai pria"><input id="coDate" type="date"><input id="coVenue" placeholder="Lokasi acara"><textarea id="coNote" placeholder="Catatan pesanan"></textarea><button class="btn" onclick="submitOrder()">BUAT PESANAN</button></div></div>`}
async function submitOrder(){if(!coName.value.trim()||!coWa.value.trim())return alert('Nama dan WhatsApp wajib diisi.');let p=products.find(x=>x.code==selectedCode),u=unitPrice(p,selectedQty);let {data,error}=await sb.rpc('create_public_order',{p_name:coName.value.trim(),p_phone:coWa.value.trim(),p_event_date:coDate.value||null,p_event_location:coVenue.value||null,p_notes:[coBride.value&&('Mempelai wanita: '+coBride.value),coGroom.value&&('Mempelai pria: '+coGroom.value),coNote.value].filter(Boolean).join(' | '),p_product_id:p.id,p_quantity:selectedQty,p_unit_price:u});if(error)return alert('Pesanan gagal: '+error.message);localStorage.setItem('ls21_last_order',data);orderSuccess(data)}
function saveRecentOrder(id){let a=JSON.parse(localStorage.getItem('ls21_recent_orders')||'[]').filter(x=>x!=id);a.unshift(id);localStorage.setItem('ls21_recent_orders',JSON.stringify(a.slice(0,5)));localStorage.setItem('ls21_last_order',id)}
function orderSuccess(id){saveRecentOrder(id);catalogView.innerHTML=`<div class="detail" style="padding-top:48px;text-align:center"><div class="successIcon">✓</div><h1 style="font:30px Georgia,serif;margin-bottom:7px">Pesanan berhasil dibuat</h1><p class="muted">Simpan kode pesanan berikut untuk memantau prosesnya.</p><div class="successCode">${id}</div><div style="display:grid;gap:8px"><button class="btn" onclick="trackOrder('${id}')">Pantau Pesanan</button><button class="btn ghost" onclick="renderCatalog()">Kembali ke Katalog</button></div></div>`}
function recentOrderList(){let a=JSON.parse(localStorage.getItem('ls21_recent_orders')||'[]');let last=localStorage.getItem('ls21_last_order');if(last&&!a.includes(last))a.unshift(last);return a.slice(0,5)}
function myOrders(){let recent=recentOrderList();catalogView.innerHTML=`<div class="trackHero"><h1>Cek Pesanan</h1><p>Masukkan kode pesanan untuk melihat perkembangan proses undangan Anda.</p></div><div class="trackBox"><div class="trackInput"><input id="trackCode" placeholder="Contoh: LS21-..." value="${recent[0]||''}" onkeydown="if(event.key==='Enter')trackOrder(this.value)"><button class="btn" onclick="trackOrder(trackCode.value)">Cek</button></div></div>${recent.length?`<div class="recentOrders"><b>Pesanan di perangkat ini</b>${recent.map(x=>`<button class="recentOrder" onclick="trackOrder('${x}')"><span><small class="muted">Kode pesanan</small><br><b>${x}</b></span><span>→</span></button>`).join('')}</div>`:''}`}
async function trackOrder(id){id=(id||'').trim();if(!id)return alert('Masukkan kode pesanan.');catalogView.innerHTML='<div class="loading" style="padding:50px 14px;text-align:center">Memeriksa pesanan…</div>';let [{data,error},{data:designs,error:de},{data:pay,error:payErr}]=await Promise.all([sb.rpc('get_public_order_status',{p_order_number:id}),sb.rpc('get_public_order_design',{p_order_number:id}),sb.rpc('get_public_payment_status',{p_order_number:id})]);if(error||!data?.length){catalogView.innerHTML=`<div class="trackHero"><h1>Pesanan tidak ditemukan</h1><p>Periksa kembali kode pesanan Anda.</p><button class="btn ghost" onclick="myOrders()">← Coba lagi</button></div>`;return}let x=data[0];saveRecentOrder(x.order_number);let sts=['baru','menunggu_pembayaran','desain','menunggu_acc','cetak','finishing','siap','selesai'],cur=sts.indexOf(x.status),d=(!de&&designs?.length)?designs[0]:null,ps=(!payErr&&pay?.length)?pay[0]:{total_paid:0,balance:Number(x.total||0),payment_status:'Belum ada pembayaran'};catalogView.innerHTML=`<div class="trackHero"><button class="btn ghost" onclick="myOrders()">← Cek Pesanan Lain</button></div><div class="trackCard"><small>KODE PESANAN</small><div class="orderNo">${x.order_number}</div><div class="trackSummary"><div><small>Status sekarang</small><b>${statusLabel[x.status]||x.status}</b></div><div><small>Total pesanan</small><b>${rup(x.total)}</b></div></div></div><div class="trackBox"><b>Pembayaran</b><div class="trackSummary" style="margin-top:10px"><div style="background:#f7f9fb;color:var(--text)"><small>Sudah dibayar</small><b>${rup(ps.total_paid)}</b></div><div style="background:#f7f9fb;color:var(--text)"><small>Sisa pembayaran</small><b>${rup(ps.balance)}</b></div></div><p class="muted" style="margin:10px 0 0">${ps.payment_status}</p></div>${d?designCustomerBox(x.order_number,d):''}<div class="section"><h3>Perjalanan Pesanan</h3></div><div class="progressLine">${sts.map((s,i)=>`<div class="progressStep ${i<cur?'done':i==cur?'current':''}"><div class="progressDot">${i<cur?'✓':i+1}</div><div class="progressText"><b>${statusLabel[s]}</b><small>${i<cur?'Tahap selesai':i==cur?'Sedang diproses':'Menunggu tahap sebelumnya'}</small></div></div>`).join('')}</div><div class="trackBox"><b>Butuh bantuan?</b><p class="muted" style="margin:6px 0 0">Sebutkan kode pesanan di atas saat menghubungi LORONGSATU21.</p></div>`}
function designCustomerBox(orderNo,d){let can=d.status==='menunggu_acc'||d.status==='revisi';return `<div class="designBox"><div class="detailMeta"><div><small class="muted">PREVIEW DESAIN · REVISI ${d.revision_number}</small><h3 style="margin:4px 0">Persetujuan Desain</h3></div><span class="designState">${d.status==='disetujui'?'Sudah ACC':d.status==='revisi'?'Revisi diminta':'Menunggu ACC'}</span></div>${d.preview_url?`<div class="designPreview"><img src="${d.preview_url}" alt="Preview desain undangan"></div>`:'<div class="notice">Preview desain belum tersedia.</div>'}${d.admin_notes?`<p class="muted">Catatan Admin: ${d.admin_notes}</p>`:''}${d.customer_notes?`<p><b>Catatan Anda:</b> ${d.customer_notes}</p>`:''}${can?`<div class="decisionBtns"><button class="btn" onclick="approveDesign('${orderNo}',${d.revision_number})">✓ ACC Desain</button><button class="btn ghost" onclick="showRevisionForm('${orderNo}',${d.revision_number})">Minta Revisi</button></div><div id="revisionArea"></div>`:''}</div>`}
function showRevisionForm(orderNo,rev){revisionArea.innerHTML=`<div class="revisionForm"><textarea id="revisionNote" placeholder="Tuliskan bagian yang perlu diperbaiki secara jelas..."></textarea><button class="btn" onclick="requestRevision('${orderNo}',${rev})">Kirim Permintaan Revisi</button></div>`}
async function approveDesign(orderNo,rev){if(!confirm('ACC desain ini? Setelah ACC, pesanan dapat dilanjutkan ke proses cetak.'))return;let {data,error}=await sb.rpc('submit_public_design_decision',{p_order_number:orderNo,p_revision_number:rev,p_decision:'approve',p_notes:null});if(error)return alert(error.message);alert('Desain berhasil di-ACC.');trackOrder(orderNo)}
async function requestRevision(orderNo,rev){let note=revisionNote.value.trim();if(!note)return alert('Tuliskan catatan revisi.');let {data,error}=await sb.rpc('submit_public_design_decision',{p_order_number:orderNo,p_revision_number:rev,p_decision:'revision',p_notes:note});if(error)return alert(error.message);alert('Permintaan revisi sudah dikirim.');trackOrder(orderNo)}

async function openAdmin(){let {data:{session}}=await sb.auth.getSession();customer.classList.add('hide');admin.classList.remove('hide');if(!session)return loginPage();dashboard()}
function closeAdmin(){admin.classList.add('hide');customer.classList.remove('hide');renderCatalog()}
function loginPage(){adminMain.innerHTML=`<div class="loginbox"><h1>Admin LORONGSATU21</h1><p class="muted">Masuk dengan akun Admin Supabase.</p><input id="loginEmail" type="email" placeholder="Email"><input id="loginPass" type="password" placeholder="Password"><button class="btn" style="width:100%" onclick="loginAdmin()">Masuk</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeAdmin()">Kembali</button></div>`}
async function loginAdmin(){let {error}=await sb.auth.signInWithPassword({email:loginEmail.value,password:loginPass.value});if(error)return alert('Login gagal: '+error.message);let {data,isErr}=await sb.rpc('is_admin');if(isErr||!data){await sb.auth.signOut();return alert('Akun ini bukan Admin.')}dashboard()}
async function logoutAdmin(){await sb.auth.signOut();loginPage()}
async function loadAdminData(){let [p,c,o,u,d,py]=await Promise.all([sb.from('products').select('*,categories(name),product_prices(quantity,unit_price),product_images(image_url,is_primary,sort_order)').order('created_at',{ascending:false}),sb.from('categories').select('*').order('sort_order'),sb.from('orders').select('*,customers(name,phone),order_items(quantity,product_name)').order('created_at',{ascending:false}),sb.from('customers').select('*').order('created_at',{ascending:false}),sb.from('order_designs').select('*').order('created_at',{ascending:false}),sb.from('payments').select('*').order('created_at',{ascending:false})]);if(p.error)throw p.error;products=(p.data||[]).map(mapProduct);categories=c.data||[];orders=o.data||[];customers=u.data||[];designs=d.data||[];payments=py.data||[]}
async function dashboard(){setMenu('mDash');adminMain.innerHTML='<div class="loading">Memuat dashboard…</div>';try{await loadAdminData()}catch(e){return adminMain.innerHTML='<div class="notice">'+e.message+'</div>'}adminMain.innerHTML=`<div class="topline"><div><small class="muted">ADMIN PANEL</small><h1>Dashboard</h1></div><button class="btn ghost" onclick="closeAdmin()">Lihat Katalog</button></div><div class="stats"><div class="stat"><small>Total Produk</small><strong>${products.length}</strong></div><div class="stat"><small>Produk Aktif</small><strong>${products.filter(x=>x.active).length}</strong></div><div class="stat"><small>Pesanan</small><strong>${orders.length}</strong></div><div class="stat"><small>Menunggu ACC</small><strong>${orders.filter(x=>x.status=='menunggu_acc').length}</strong></div></div>${orderTable(orders.slice(0,10))}`}
async function productsPage(){setMenu('mProd');await loadAdminData();adminMain.innerHTML=`<div class="topline"><div><h1>Manajemen Produk</h1><p class="muted">Produk tersimpan di Supabase.</p></div><button class="btn" onclick="productForm()">＋ Tambah Produk</button></div><div id="productTable"></div>`;drawProductTable()}
function drawProductTable(){productTable.innerHTML=`<div class="tablebox"><div class="row head"><span>No</span><span>Foto</span><span>Kode</span><span>Nama Produk</span><span>Kategori</span><span>Harga</span><span>Status</span><span>Aksi</span></div>${products.map((x,i)=>`<div class="row"><span>${i+1}</span><span>${x.image?`<img class="thumb" src="${x.image}">`:'-'}</span><b>${x.code}</b><span>${x.name}</span><span>${x.cat}</span><span>${rup(x.p100)} · ${rup(x.p300)} · ${rup(x.p500)} · ${rup(x.p1000)}</span><span>${x.active?'Aktif':'Nonaktif'}</span><span class="actions"><button onclick="productForm('${x.code}')">✎</button><button onclick="toggleProduct('${x.code}')">◉</button><button class="del" onclick="deleteProduct('${x.code}')">⌫</button></span></div>`).join('')}</div>`}
function productForm(code=''){let x=products.find(v=>v.code==code)||{code:'LS-U-'+String(products.length+1).padStart(4,'0'),name:'',cat:categories[0]?.name||'',sub:'Floral',material:'',size:'10 × 21 cm',model:'Lipat 2',color:'',desc:'',p100:0,p300:0,p500:0,p1000:0,active:true,image:''};pendingFile=null;adminMain.innerHTML=`<div class="topline"><h1>${code?'Edit':'Tambah'} Produk</h1></div><div class="formwrap"><div class="panel"><div class="formgrid"><div class="field full"><label>Nama Produk *</label><input id="fName" value="${x.name}"></div><div class="field"><label>Kode *</label><input id="fCode" value="${x.code}"></div><div class="field"><label>Kategori</label><select id="fCat">${categories.map(v=>`<option value="${v.id}" ${v.name==x.cat?'selected':''}>${v.name}</option>`).join('')}</select></div><div class="field"><label>Motif</label><input id="fSub" value="${x.sub||''}"></div><div class="field"><label>Bahan</label><input id="fMat" value="${x.material||''}"></div><div class="field"><label>Ukuran</label><input id="fSize" value="${x.size||''}"></div><div class="field"><label>Model</label><input id="fModel" value="${x.model||''}"></div><div class="field"><label>Warna</label><input id="fColor" value="${x.color||''}"></div><div class="field full"><label>Deskripsi</label><textarea id="fDesc">${x.desc||''}</textarea></div><div class="field full"><label>Harga per pcs</label><div class="prices"><input type="number" id="f100" value="${x.p100}"><input type="number" id="f300" value="${x.p300}"><input type="number" id="f500" value="${x.p500}"><input type="number" id="f1000" value="${x.p1000}"></div></div><div class="field full"><label>Foto Produk</label><input type="file" accept="image/jpeg,image/png,image/webp" onchange="pendingFile=this.files[0]"></div><div class="field full"><label><input type="checkbox" id="fActive" ${x.active?'checked':''}> Aktif</label></div></div></div><div class="panel"><h3>Foto saat ini</h3><div class="previewPic">${x.image?`<img src="${x.image}">`:'Belum ada foto'}</div></div></div><div class="footerBtns"><button class="btn ghost" onclick="productsPage()">Batal</button><button class="btn" onclick="saveProduct('${code}')">Simpan Produk</button></div>`}
async function saveProduct(oldCode){if(!fCode.value.trim()||!fName.value.trim())return alert('Kode dan nama wajib diisi.');let old=products.find(x=>x.code==oldCode);let row={product_code:fCode.value.trim(),category_id:fCat.value||null,name:fName.value.trim(),slug:slugify(fName.value)+'-'+fCode.value.toLowerCase(),description:fDesc.value,motif:fSub.value,material:fMat.value,size:fSize.value,model:fModel.value,color:fColor.value,is_active:fActive.checked};let res=old?await sb.from('products').update(row).eq('id',old.id).select().single():await sb.from('products').insert(row).select().single();if(res.error)return alert(res.error.message);let pid=res.data.id;await sb.from('product_prices').delete().eq('product_id',pid);let prs=[[100,f100.value],[300,f300.value],[500,f500.value],[1000,f1000.value]].filter(x=>Number(x[1])>0).map(x=>({product_id:pid,quantity:x[0],unit_price:Number(x[1])}));if(prs.length){let r=await sb.from('product_prices').insert(prs);if(r.error)return alert(r.error.message)}if(pendingFile){let ext=pendingFile.name.split('.').pop().toLowerCase(),path=`${pid}/${Date.now()}.${ext}`;let up=await sb.storage.from('product-images').upload(path,pendingFile,{upsert:false});if(up.error)return alert('Produk tersimpan, foto gagal: '+up.error.message);let url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;await sb.from('product_images').update({is_primary:false}).eq('product_id',pid);await sb.from('product_images').insert({product_id:pid,image_url:url,is_primary:true,sort_order:0})}alert('Produk tersimpan.');productsPage()}
async function toggleProduct(code){let x=products.find(v=>v.code==code);let {error}=await sb.from('products').update({is_active:!x.active}).eq('id',x.id);if(error)return alert(error.message);productsPage()}
async function deleteProduct(code){if(!confirm('Hapus produk ini?'))return;let x=products.find(v=>v.code==code);let {error}=await sb.from('products').delete().eq('id',x.id);if(error)return alert(error.message);productsPage()}
async function categoriesPage(){setMenu('mCat');await loadAdminData();adminMain.innerHTML=`<h1>Kategori</h1><div class="panel"><div class="toolbar"><input id="newCat" placeholder="Nama kategori baru"><button class="btn" onclick="addCat()">Tambah</button></div><div class="catlist">${categories.map(x=>`<span class="catitem">${x.name} <button onclick="delCat('${x.id}')">×</button></span>`).join('')}</div></div>`}
async function addCat(){let name=newCat.value.trim();if(!name)return;let {error}=await sb.from('categories').insert({name,slug:slugify(name)});if(error)return alert(error.message);categoriesPage()}
async function delCat(id){if(!confirm('Hapus kategori?'))return;let {error}=await sb.from('categories').delete().eq('id',id);if(error)return alert(error.message);categoriesPage()}
function orderTable(o){return `<div class="tablebox"><div class="orderrow" style="font-weight:bold;background:#f7fbff"><span>Kode</span><span>Pelanggan</span><span>Jumlah</span><span>Status</span><span>Aksi</span></div>${o.map(x=>`<div class="orderrow"><b>${x.order_number}</b><span>${x.customers?.name||'-'}</span><span>${x.order_items?.[0]?.quantity||0} pcs</span><span>${statusLabel[x.status]||x.status}</span><span><button class="btn" onclick="orderDetail('${x.id}')">Buka</button></span></div>`).join('')}</div>`}
async function ordersPage(){setMenu('mOrder');await loadAdminData();adminMain.innerHTML='<h1>Pesanan</h1>'+orderTable(orders)}
function orderDetail(id){pendingDesignFile=null;let x=orders.find(v=>v.id==id),it=x.order_items?.[0]||{},d=designs.find(v=>v.order_id==id);adminMain.innerHTML=`<button class="btn ghost" onclick="ordersPage()">← Kembali</button><div class="topline" style="margin-top:16px"><div><small class="muted">DETAIL PESANAN</small><h1>${x.order_number}</h1></div><span class="pill">${statusLabel[x.status]||x.status}</span></div><div class="orderAdminGrid"><div class="panel"><small>Pelanggan</small><b>${x.customers?.name||'-'}</b><p style="margin-bottom:0">${x.customers?.phone||'-'}</p></div><div class="panel"><small>Produk</small><b>${it.product_name||'-'}</b><p style="margin-bottom:0">${it.quantity||0} pcs</p></div><div class="panel"><small>Tanggal acara</small><b>${x.event_date||'-'}</b><p style="margin-bottom:0">${x.event_location||'-'}</p></div><div class="panel"><small>Total</small><b style="font-size:22px">${rup(x.total)}</b><p style="margin-bottom:0">${x.notes||'Tanpa catatan'}</p></div></div><div class="panel"><h3>Pembayaran</h3>${paymentSummaryHtml(x)}<div class="formgrid"><div class="field"><label>Jumlah diterima</label><input id="payAmount" type="number" min="1" placeholder="Contoh: 100000"></div><div class="field"><label>Metode</label><select id="payMethod"><option value="Tunai">Tunai</option><option value="Transfer">Transfer</option><option value="QRIS">QRIS</option><option value="Lainnya">Lainnya</option></select></div><div class="field full"><label>Catatan / Referensi</label><input id="payRef" placeholder="Opsional"></div></div><button class="btn" onclick="addPayment('${id}')">Catat Pembayaran</button></div><div class="panel"><label><b>Status Produksi</b></label><select id="orderStatus" style="width:100%;padding:12px;margin:10px 0;border:1px solid var(--line);border-radius:9px">${Object.entries(statusLabel).map(([k,v])=>`<option value="${k}" ${k==x.status?'selected':''}>${v}</option>`).join('')}</select><button class="btn" onclick="saveOrderStatus('${id}')">Simpan Status</button></div><div class="panel designAdmin"><h3>Desain & ACC Pelanggan</h3><div class="formgrid"><div class="field"><label>Revisi ke</label><input id="dRev" type="number" min="1" value="${d?.revision_number||1}"></div><div class="field"><label>Status desain</label><select id="dStatus"><option value="draft" ${d?.status==='draft'?'selected':''}>Draft</option><option value="menunggu_acc" ${d?.status==='menunggu_acc'?'selected':''}>Menunggu ACC</option><option value="revisi" ${d?.status==='revisi'?'selected':''}>Revisi</option><option value="disetujui" ${d?.status==='disetujui'?'selected':''}>Disetujui</option></select></div><div class="field full"><label>Upload Preview Desain</label><input id="dFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="pendingDesignFile=this.files[0]"><small class="muted">JPG, PNG, atau WEBP · maksimal 8 MB. Jika tidak memilih file baru, preview lama tetap digunakan.</small></div><div class="field full"><label>Catatan Admin</label><textarea id="dAdmin">${d?.admin_notes||''}</textarea></div>${d?.customer_notes?`<div class="field full"><div class="notice"><b>Catatan revisi pelanggan:</b><br>${d.customer_notes}</div></div>`:''}</div><button class="btn" onclick="saveDesign('${id}','${d?.id||''}')">Simpan / Kirim Desain</button>${d?.preview_url?`<div class="designPreview" style="max-width:430px"><img src="${d.preview_url}"></div>`:''}</div>`}
async function saveDesign(orderId,designId){let current=designId?designs.find(x=>x.id==designId):null,previewUrl=current?.preview_url||null;if(pendingDesignFile){if(pendingDesignFile.size>8*1024*1024)return alert('Ukuran preview maksimal 8 MB.');let ext=pendingDesignFile.name.split('.').pop().toLowerCase();if(!['jpg','jpeg','png','webp'].includes(ext))return alert('Format preview harus JPG, PNG, atau WEBP.');let path=`${orderId}/rev-${Number(dRev.value)||1}-${Date.now()}.${ext}`;let up=await sb.storage.from('design-previews').upload(path,pendingDesignFile,{upsert:false,contentType:pendingDesignFile.type});if(up.error)return alert('Upload preview gagal: '+up.error.message);previewUrl=sb.storage.from('design-previews').getPublicUrl(path).data.publicUrl;}let row={order_id:orderId,revision_number:Number(dRev.value)||1,preview_url:previewUrl,status:dStatus.value,admin_notes:dAdmin.value.trim()||null,customer_notes:current?.customer_notes||null};let r=designId?await sb.from('order_designs').update(row).eq('id',designId):await sb.from('order_designs').insert(row);if(r.error)return alert(r.error.message);if(row.status==='menunggu_acc')await sb.from('orders').update({status:'menunggu_acc'}).eq('id',orderId);pendingDesignFile=null;alert(row.status==='menunggu_acc'?'Preview desain berhasil diunggah dan dikirim untuk ACC.':'Data desain tersimpan.');await loadAdminData();orderDetail(orderId)}
async function designsPage(){setMenu('mDesign');await loadAdminData();let waiting=orders.filter(o=>['desain','menunggu_acc'].includes(o.status));adminMain.innerHTML=`<div class="topline"><div><h1>Desain & ACC</h1><p class="muted">Kelola preview, revisi, dan persetujuan pelanggan.</p></div></div>${orderTable(waiting)}`}

function paymentsFor(orderId){return payments.filter(p=>p.order_id===orderId&&p.payment_status==='diterima')}
function paymentSummaryHtml(o){let paid=paymentsFor(o.id).reduce((a,p)=>a+Number(p.amount||0),0),bal=Math.max(0,Number(o.total||0)-paid),pct=Number(o.total||0)?Math.min(100,Math.round(paid/Number(o.total)*100)):0;return `<div style="margin:8px 0 14px"><div style="display:flex;justify-content:space-between;gap:10px"><span>Terbayar <b>${rup(paid)}</b></span><span>Sisa <b>${rup(bal)}</b></span></div><div style="height:8px;background:#e8edf3;border-radius:999px;margin-top:8px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--green)"></div></div><small class="muted">${pct}% dari total pesanan</small></div>`}
async function addPayment(orderId){let amount=Number(payAmount.value||0);if(amount<=0)return alert('Masukkan jumlah pembayaran.');let row={order_id:orderId,amount,payment_method:payMethod.value,payment_status:'diterima',reference_number:payRef.value.trim()||null,paid_at:new Date().toISOString()};let {error}=await sb.from('payments').insert(row);if(error)return alert(error.message);let o=orders.find(x=>x.id===orderId),paid=paymentsFor(orderId).reduce((a,p)=>a+Number(p.amount||0),0)+amount;if(o?.status==='menunggu_pembayaran'&&paid>0)await sb.from('orders').update({status:'desain'}).eq('id',orderId);alert('Pembayaran berhasil dicatat.');await loadAdminData();orderDetail(orderId)}
async function paymentsPage(){setMenu('mPay');await loadAdminData();let rows=orders.map(o=>{let paid=paymentsFor(o.id).reduce((a,p)=>a+Number(p.amount||0),0),bal=Math.max(0,Number(o.total||0)-paid);return {o,paid,bal}});let total=rows.reduce((a,x)=>a+x.paid,0),out=rows.reduce((a,x)=>a+x.bal,0);adminMain.innerHTML=`<div class="topline"><div><h1>Pembayaran</h1><p class="muted">Pantau DP dan pelunasan setiap pesanan.</p></div></div><div class="stats"><div class="stat"><small>Total Diterima</small><strong>${rup(total)}</strong></div><div class="stat"><small>Piutang Pesanan</small><strong>${rup(out)}</strong></div><div class="stat"><small>Lunas</small><strong>${rows.filter(x=>x.bal<=0&&Number(x.o.total)>0).length}</strong></div><div class="stat"><small>Belum Lunas</small><strong>${rows.filter(x=>x.bal>0).length}</strong></div></div><div class="tablebox"><div class="orderrow" style="font-weight:bold;background:#f7fbff"><span>Kode</span><span>Pelanggan</span><span>Total</span><span>Terbayar / Sisa</span><span>Aksi</span></div>${rows.map(x=>`<div class="orderrow"><b>${x.o.order_number}</b><span>${x.o.customers?.name||'-'}</span><span>${rup(x.o.total)}</span><span><b>${rup(x.paid)}</b><br><small class="muted">Sisa ${rup(x.bal)}</small></span><span><button class="btn" onclick="orderDetail('${x.o.id}')">Buka</button></span></div>`).join('')}</div>`}

async function saveOrderStatus(id){let {error}=await sb.from('orders').update({status:orderStatus.value}).eq('id',id);if(error)return alert(error.message);ordersPage()}
async function customersPage(){setMenu('mCust');await loadAdminData();adminMain.innerHTML=`<h1>Pelanggan</h1><div class="tablebox">${customers.map(x=>`<div class="orderrow"><span>${x.phone}</span><b>${x.name}</b><span></span><span>${x.email||''}</span><span></span></div>`).join('')}</div>`}
async function reportsPage(){setMenu('mReport');await loadAdminData();let rev=orders.reduce((a,x)=>a+Number(x.total||0),0);adminMain.innerHTML=`<h1>Laporan</h1><div class="reportgrid"><div class="stat"><small>Omzet Pesanan</small><strong>${rup(rev)}</strong></div><div class="stat"><small>Jumlah Pesanan</small><strong>${orders.length}</strong></div><div class="stat"><small>Rata-rata</small><strong>${rup(orders.length?rev/orders.length:0)}</strong></div></div>`}
renderHome();
</script></body></html>
